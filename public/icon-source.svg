<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TextDuet icon</title>
  <desc id="desc">Two overlapping text panels in warm terracotta and ochre, representing a bilingual duet on one page.</desc>

  <!-- 背景：赤陶色圆角方块 -->
  <rect width="512" height="512" rx="104" fill="#9c5e2e"/>

  <!-- 后层面板：暖纸色，略微左上 -->
  <rect x="92" y="100" width="248" height="296" rx="32" fill="#f5f2ec"/>

  <!-- 前层面板：赭石色，略微右下，形成“二重奏”层次 -->
  <rect x="196" y="164" width="208" height="280" rx="32" fill="#7c6035"/>

  <!-- 后层面板上的文本行：赤陶色 -->
  <rect x="132" y="152" width="168" height="24" rx="8" fill="#9c5e2e"/>
  <rect x="132" y="204" width="128" height="24" rx="8" fill="#9c5e2e"/>
  <rect x="132" y="256" width="96" height="24" rx="8" fill="#9c5e2e"/>
  <rect x="132" y="308" width="144" height="24" rx="8" fill="#9c5e2e"/>

  <!-- 前层面板上的文本行：暖纸色 -->
  <rect x="236" y="216" width="128" height="22" rx="7" fill="#f5f2ec"/>
  <rect x="236" y="266" width="128" height="22" rx="7" fill="#f5f2ec"/>
  <rect x="236" y="316" width="96" height="22" rx="7" fill="#f5f2ec"/>
  <rect x="236" y="366" width="128" height="22" rx="7" fill="#f5f2ec"/>
</svg>
