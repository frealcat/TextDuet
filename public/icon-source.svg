<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TextDuet icon</title>
  <desc id="desc">A bold T and a smaller t in terracotta and ochre on warm paper, representing two languages reading together on one page.</desc>

  <!-- Background: warm paper, rounded square -->
  <rect width="512" height="512" rx="104" fill="#f5f2ec"/>

  <!-- Main T: terracotta, dominant element -->
  <g fill="#9c5e2e">
    <rect x="96" y="120" width="320" height="80" rx="20"/>
    <rect x="232" y="120" width="48" height="240" rx="20"/>
  </g>

  <!-- Small t: ochre, echoes the main T like a duet -->
  <g fill="#7c6035">
    <rect x="192" y="384" width="128" height="36" rx="10"/>
    <rect x="248" y="384" width="20" height="96" rx="10"/>
  </g>
</svg>
