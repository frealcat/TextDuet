name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Scan source secrets and licenses
        run: npm run release:source-check
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const manifest = JSON.parse(await readFile('package.json', 'utf8'));
          const expected = `v${manifest.version}`;
          if (process.env.RELEASE_TAG !== expected) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${manifest.version}`);
          }
          const tagSha = execFileSync('git', ['rev-list', '-n', '1', process.env.RELEASE_TAG], { encoding: 'utf8' }).trim();
          if (tagSha !== process.env.RELEASE_SHA) {
            throw new Error(`Resolved tag ${process.env.RELEASE_TAG} (${tagSha}) does not match checked-out commit ${process.env.RELEASE_SHA}`);
          }
          const mainSha = execFileSync('git', ['rev-parse', 'origin/main'], { encoding: 'utf8' }).trim();
          try {
            execFileSync('git', ['merge-base', '--is-ancestor', process.env.RELEASE_SHA, mainSha], { stdio: 'pipe' });
          } catch {
            throw new Error(`Release commit ${process.env.RELEASE_SHA} is not reachable from origin/main (${mainSha})`);
          }
          NODE
      - name: Build, test, and verify release
        run: npm run release:check
      - name: Install Chromium for browser regression
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run deterministic browser smoke regression
        env:
          EXTENSION_DIR: ${{ github.workspace }}/.output/chrome-mv3
          FIXTURE_URL: http://127.0.0.1:8765/multilingual.html
        run: |
          node scripts/serve-fixtures.mjs > "$RUNNER_TEMP/textduet-fixtures.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if ! kill -0 "$fixture_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/textduet-fixtures.log"
              exit 1
            fi
            curl --fail --silent http://127.0.0.1:8765/multilingual.html >/dev/null && break
            sleep 1
          done
          kill -0 "$fixture_pid" 2>/dev/null || { cat "$RUNNER_TEMP/textduet-fixtures.log"; exit 1; }
          curl --fail --silent http://127.0.0.1:8765/multilingual.html >/dev/null
          PLAYWRIGHT_ENTRY="$(node --input-type=module -e 'process.stdout.write(await import.meta.resolve("playwright"))')" \
            CHROME_EXECUTABLE="$(node --input-type=module -e 'const playwrightModule = await import("playwright"); const { chromium } = playwrightModule.default ?? playwrightModule; process.stdout.write(chromium.executablePath())')" \
            EXTENSION_DIR="${{ github.workspace }}/.output/chrome-mv3" \
            FIXTURE_URL=http://127.0.0.1:8765/multilingual.html \
            npm run test:browser:smoke
      - name: Upload fixture server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: textduet-release-fixture-server-log
          path: ${{ runner.temp }}/textduet-fixtures.log
          if-no-files-found: ignore
      - name: Build public privacy pages
        run: npm run pages:build
      - name: Verify public privacy pages
        run: npm run pages:verify
      - name: Verify public privacy page build
        run: |
          test -s .pages/privacy/index.html
          test -s .pages/zh-CN/privacy/index.html
          test -s .pages/assets/site.css
          # Match actual event attributes (for example onclick=), not the
          # common HTML `content=` metadata attribute.
          ! rg -n '<script\b|\bon[a-z][a-z0-9-]*\s*=' .pages
      - name: Verify release notes are publication-ready
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          npm run release:notes-check -- "$RELEASE_VERSION"
      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          test -s "docs/RELEASE-NOTES-${RELEASE_VERSION}.md"
          test -s "docs/RELEASE-NOTES-${RELEASE_VERSION}.zh-CN.md"
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "TextDuet $RELEASE_TAG" \
            --notes-file "docs/RELEASE-NOTES-${RELEASE_VERSION}.md" \
            ".output/textduet-${RELEASE_VERSION}-chrome.zip" \
            .output/SHA256SUMS.txt \
            .output/SBOM.cdx.json \
            .output/THIRD_PARTY_LICENSES.json \
            "docs/RELEASE-NOTES-${RELEASE_VERSION}.md" \
            "docs/RELEASE-NOTES-${RELEASE_VERSION}.zh-CN.md"
