<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Virtual reading stream</title>
  </head>
  <body>
    <nav aria-label="Stream controls" data-td-expect="exclude">
      <button type="button" data-td-expect="exclude">Load older entries</button>
    </nav>
    <main>
      <h1 data-td-expect="include">Virtual reading stream</h1>
      <section id="virtual-list" aria-label="Reading entries">
        <article data-virtual-row="reused">
          <p data-td-expect="include" data-version="initial">
            The first visible entry explains how a recycled row begins.
          </p>
        </article>
        <article data-virtual-row="stable">
          <p data-td-expect="include">
            A stable entry remains mounted while nearby rows are recycled.
          </p>
        </article>
      </section>
    </main>
    <template id="replacement-body-template">
      <div data-replacement-body>
        <nav aria-label="Replacement controls" data-td-expect="exclude">
          <button type="button" data-td-expect="exclude">Open filters</button>
        </nav>
        <main>
          <h1 data-td-expect="include">Replacement reading stream</h1>
          <section id="replacement-list" aria-label="Replacement entries">
            <p data-td-expect="include" data-version="replaced-body">
              A newly mounted document body remains observable during the active run.
            </p>
          </section>
        </main>
      </div>
    </template>
  </body>
</html>
